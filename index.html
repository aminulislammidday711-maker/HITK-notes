<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Surf & Reveal</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #0f0f13;
            --card-bg: #1e1e24;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .upload-box {
            border: 2px dashed #444;
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .upload-box:hover {
            border-color: var(--primary);
        }

        input[type="file"] {
            display: none;
        }

        .preview-area {
            margin: 20px 0;
            display: none;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background-color: var(--secondary);
            transform: scale(1.05);
        }

        button:disabled {
            background-color: #444;
            cursor: not-defined;
        }

        .result-area {
            margin-top: 30px;
            display: none;
        }

        .result-area img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>

    <p class="subtitle">Upload a photo, let the AI surf the net and process the image.</p>

        <!-- Upload Section -->

            <p>Click to Upload Photo</p>
            <input type="file" id="fileInput" accept="image/jpeg, image/png">
        </div>

        <!-- Preview Section -->
        <div class="preview-area" id="previewArea">
            <p>Original Image:</p>
            <img id="previewImg" src="" alt="Preview">
        </div>

        <!-- Action Button -->
        <button id="processBtn" onclick="processImage()">Surf Internet & Remove Clothes</button>

        <!-- Loader -->
        <div class="loader" id="loader"></div>
        <p class="status-text" id="statusText"></p>

        <!-- Result Section -->
        <div class="result-area" id="resultArea">
            <h3>AI Result:</h3>
            <img id="resultImg" src="" alt="Processed Result">
        </div>
    </div>
